events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # sendfile        on;
    # keepalive_timeout  65;

    server {
        listen       80;
        server_name  localhost;
        root         /usr/share/nginx/html;
        index        index.html;

        location / {
            # Serve actual files if they exist; otherwise fall back to SPA entry
            # Removing $uri/ avoids directory matches (e.g., /projects/) returning 403
            try_files $uri $uri/ /index.html;
        }

        # # For any route without a file extension, serve the SPA entry
        # # This ensures /projects, /blog, etc. are handled by Vue Router
        # location ~* ^/(?!.*\.[^/]+)$|^/(?!.*\.[^/]+).+/?$ {
        #     try_files /index.html =404;
        # }

        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
    }
}
